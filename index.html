<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Meal Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF8;
      --ink: #1a1a1a;
      --muted: #74746f;
      --line: #E0E0DC;
      --soft: #F5F5F3;
      --weekend: #F2F2F0;
      --amber: #FFF3E0;
      --amber-line: #E67E22;
      --travel: #EEF2F7;
      --card: #fff;
      --shadow: 0 16px 45px rgba(20, 20, 16, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 15px;
    }
    h1, h2, h3 { font-family: "Playfair Display", Georgia, serif; letter-spacing: 0; }
    button, input, select, textarea { font: inherit; }
    button { min-height: 44px; cursor: pointer; }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--ink);
      color: #fff;
      padding: 14px 16px;
    }
    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand h1 { margin: 0; font-size: 24px; line-height: 1; }
    .brand p { margin: 4px 0 0; color: #cfcfc9; font-size: 13px; }
    .top-tabs { display: none; gap: 8px; }
    .tab-btn {
      border: 1px solid rgba(255,255,255,0.14);
      background: transparent;
      color: #ddd;
      border-radius: 8px;
      padding: 0 14px;
      font-weight: 700;
    }
    .tab-btn.active { background: #fff; color: var(--ink); }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 14px 94px;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .toolbar, .settings-bar, .filters {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .settings-bar {
      background: #fff;
      border: 1px solid #ececea;
      border-radius: 8px;
      padding: 10px;
    }
    .field {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .field input, .field select, .field textarea, .search {
      min-height: 44px;
      border: 1px solid #d8d8d3;
      border-radius: 8px;
      background: #fff;
      padding: 9px 11px;
      color: var(--ink);
      outline: none;
    }
    .field textarea { min-height: 84px; resize: vertical; }
    .search { flex: 1; min-width: 160px; }
    .btn {
      border: 1px solid #d8d8d3;
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 0 13px;
      font-weight: 700;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .btn:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn.good { background: #27AE60; color: #fff; border-color: #27AE60; }
    .btn.danger { color: #a23227; }
    .btn.icon { width: 44px; padding: 0; }
    .segmented {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      background: #ecece7;
      border-radius: 8px;
    }
    .segmented button {
      min-height: 38px;
      border: 0;
      background: transparent;
      border-radius: 7px;
      padding: 0 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .segmented button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 5px rgba(0,0,0,0.08); }
    .week-title { flex: 1; text-align: center; font-weight: 800; min-width: 190px; }
    .day-list { display: grid; gap: 10px; }
    .day-card {
      display: grid;
      grid-template-columns: 92px 1fr;
      background: #fff;
      border: 1px solid #ececea;
      border-radius: 8px;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }
    .day-card:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.07); }
    .day-card.today { border: 2px solid var(--ink); }
    .day-card.locked { background: var(--amber); border: 2px solid var(--amber-line); }
    .day-card.travel { background: var(--travel); }
    .day-card.blank { background: var(--soft); border: 1px dashed var(--line); }
    .day-card.weekend:not(.locked):not(.travel) { background: var(--weekend); }
    .day-side {
      min-height: 118px;
      padding: 12px 8px;
      color: #fff;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      gap: 3px;
    }
    .day-side .emoji { font-size: 23px; }
    .day-side .name { font-weight: 800; font-size: 13px; }
    .day-side .date { font-size: 12px; opacity: .86; }
    .day-body { padding: 12px; display: grid; gap: 11px; }
    .meal-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .dish-name { font-weight: 800; font-size: 17px; line-height: 1.22; }
    .note { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .travel .dish-name, .travel .note, .travel .chip { text-decoration: line-through; color: #718093; }
    .empty-copy { color: #9a9a92; font-style: italic; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #F0F0EE;
      font-size: 12px;
      font-weight: 700;
    }
    .chip.main { color: #fff; }
    .day-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .mini {
      min-height: 34px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: rgba(255,255,255,.75);
      font-size: 12px;
      font-weight: 800;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(44px, 1fr));
      gap: 5px;
    }
    .dow {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 0;
    }
    .month-title { margin: 22px 0 10px; font-size: 22px; }
    .cal-cell {
      min-height: 84px;
      border: 1px solid #e2e2de;
      border-radius: 8px;
      background: #fff;
      padding: 7px;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .cal-cell:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .cal-cell.out { visibility: hidden; pointer-events: none; }
    .cal-cell.today { border: 2px solid var(--ink); }
    .cal-cell.weekend { background: var(--weekend); }
    .cal-cell.blank, .cal-cell.empty { background: var(--soft); border-style: dashed; color: #999; }
    .cal-cell.travel { background: var(--travel); }
    .cal-date { display: flex; justify-content: space-between; font-weight: 800; font-size: 12px; color: #777; }
    .cal-emoji { display: block; font-size: 24px; margin-top: 5px; }
    .cal-dish { font-weight: 800; font-size: 12px; line-height: 1.2; margin-top: 2px; }
    .cal-sides { color: var(--muted); font-size: 10px; line-height: 1.25; margin-top: 2px; }
    .dish-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }
    .dish-card {
      background: #fff;
      border: 1px solid #ececea;
      border-radius: 8px;
      padding: 12px;
      transition: box-shadow 0.15s, border-color 0.15s;
      cursor: pointer;
    }
    .dish-card:hover, .dish-card.selected { box-shadow: 0 10px 24px rgba(0,0,0,0.08); border-color: var(--ink); }
    .dish-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .badges { display: flex; flex-wrap: wrap; gap: 5px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      background: #F0F0EE;
    }
    .badge.cuisine { color: #fff; }
    .rating { color: #c88718; letter-spacing: 0; }
    .history-week {
      background: #fff;
      border: 1px solid #ececea;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .history-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      background: #f6f6f2;
      font-weight: 800;
    }
    .history-row {
      display: grid;
      grid-template-columns: 92px 32px 1fr auto;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #f0f0ee;
      align-items: center;
    }
    .history-row .day { color: var(--muted); font-weight: 800; font-size: 13px; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,0.34);
      backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: min(560px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .modal h3 { margin: 0 0 12px; font-size: 24px; }
    .form-grid { display: grid; gap: 12px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .picker-list {
      max-height: 220px;
      overflow: auto;
      border: 1px solid #e1e1dc;
      border-radius: 8px;
    }
    .pick-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid #f0f0ee;
      cursor: pointer;
    }
    .pick-row:last-child { border-bottom: 0; }
    .pick-row.active { background: #fff7e9; font-weight: 800; }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .swatch.active { border-color: var(--ink); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translate(-50%, 130%);
      background: var(--ink);
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      z-index: 70;
      box-shadow: 0 12px 30px rgba(0,0,0,0.24);
      transition: transform 0.2s;
      font-weight: 800;
      max-width: calc(100vw - 24px);
    }
    .toast.show { transform: translate(-50%, 0); }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(250,250,248,.94);
      border-top: 1px solid #deded8;
      backdrop-filter: blur(8px);
    }
    .bottom-nav button {
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 800;
    }
    .bottom-nav .ico { font-size: 18px; line-height: 1; }
    .bottom-nav button.active { background: var(--ink); color: #fff; }
    .muted { color: var(--muted); }
    .hide { display: none !important; }
    @media (min-width: 820px) {
      .top-tabs { display: flex; }
      .bottom-nav { display: none; }
      main { padding-bottom: 36px; }
      .day-card { grid-template-columns: 116px 1fr; }
      .day-body { grid-template-columns: 1.2fr 1fr auto; align-items: center; }
      .day-actions { min-width: 160px; }
    }
    @media (max-width: 560px) {
      .brand h1 { font-size: 21px; }
      .two { grid-template-columns: 1fr; }
      .toolbar .btn, .settings-bar .field, .settings-bar select { flex: 1; }
      .modal-overlay { align-items: flex-end; padding: 0; }
      .modal { border-radius: 16px 16px 0 0; max-height: 92vh; }
      .history-row { grid-template-columns: 70px 28px 1fr; }
      .history-row .mini { grid-column: 1 / -1; }
      .cal-cell { min-height: 66px; padding: 5px; }
      .cal-emoji { font-size: 18px; }
      .cal-dish { font-size: 10px; }
      .cal-sides { display: none; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>Family Meal Planner</h1>
        <p id="syncStatus">Loading fresh dishes from Google Sheets</p>
      </div>
      <nav class="top-tabs" id="topTabs"></nav>
    </div>
  </header>

  <main>
    <section class="panel active" id="weekPanel"></section>
    <section class="panel" id="calendarPanel"></section>
    <section class="panel" id="libraryPanel"></section>
    <section class="panel" id="historyPanel"></section>
  </main>

  <nav class="bottom-nav" id="bottomTabs"></nav>
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="toast" id="toast"></div>

  <script>
    const API_URL = "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";

    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const CUISINES = {
      Korean: { emoji: "🇰🇷", color: "#C0392B" },
      Japanese: { emoji: "🇯🇵", color: "#2C3E50" },
      Italian: { emoji: "🇮🇹", color: "#27AE60" },
      American: { emoji: "🇺🇸", color: "#2980B9" },
      Chinese: { emoji: "🇨🇳", color: "#E67E22" },
      Mediterranean: { emoji: "🌿", color: "#16A085" },
      "Southeast Asian": { emoji: "🌶️", color: "#8E44AD" },
      Other: { emoji: "🍽️", color: "#7F8C8D" }
    };
    Object.assign(CUISINES, JSON.parse(localStorage.getItem("customCuisines") || "{}"));
    const COLOR_PRESETS = Object.values(CUISINES).map(c => c.color).concat(["#A04000", "#5D6D7E", "#BA4A00", "#1F618D"]);
    const tabs = [
      ["week", "Week", "◷"],
      ["calendar", "Calendar", "▦"],
      ["library", "Library", "□"],
      ["history", "History", "◴"]
    ];

    const state = {
      tab: "week",
      dishes: [],
      history: [],
      weekStartDay: localStorage.getItem("weekStartDay") || "Mon",
      anchorCuisine: localStorage.getItem("anchorCuisine") || "Korean",
      weekView: "Weekly",
      calendarMode: "Monthly",
      historyMode: "Weekly",
      currentWeekStart: startOfWeek(new Date(), "Mon"),
      currentMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
      weekData: null,
      selectedDishId: "",
      libraryFilters: { q: "", cuisine: "", type: "", tag: "" }
    };

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      renderTabs();
      await refreshAll();
      bindGlobalKeys();
    }

    async function refreshAll() {
      try {
        setStatus("Loading fresh data");
        const [dishes, history] = await Promise.all([apiGet("getDishes"), apiGet("getHistory")]);
        state.dishes = normalizeDishes(dishes || []);
        state.dishes.forEach(d => ensureCuisine(d.cuisine));
        state.history = history || [];
        await loadWeek(formatDate(state.currentWeekStart));
        setStatus("Synced " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
      } catch (err) {
        setStatus("API not connected");
        toast(err.message || "Could not load data");
        state.weekData = makeEmptyWeek(formatDate(state.currentWeekStart));
        render();
      }
    }

    async function loadWeek(weekStart) {
      const res = await apiGet("getWeekPlan", { weekStart });
      state.weekData = res && res.weekData ? normalizeWeek(res.weekData, weekStart) : makeEmptyWeek(weekStart);
      state.anchorCuisine = state.weekData.anchorCuisine || state.anchorCuisine;
      render();
    }

    function render() {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.getElementById(state.tab + "Panel").classList.add("active");
      renderTabs();
      renderWeek();
      renderCalendar();
      renderLibrary();
      renderHistory();
    }

    function renderTabs() {
      const html = tabs.map(([id, label, icon]) => `<button class="${state.tab === id ? "active" : ""}" data-tab="${id}"><span class="ico">${icon}</span><span>${label}</span></button>`).join("");
      const top = tabs.map(([id, label]) => `<button class="tab-btn ${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`).join("");
      document.getElementById("bottomTabs").innerHTML = html;
      document.getElementById("topTabs").innerHTML = top;
      document.querySelectorAll("[data-tab]").forEach(btn => btn.onclick = () => {
        state.tab = btn.dataset.tab;
        render();
      });
    }

    function renderWeek() {
      const panel = document.getElementById("weekPanel");
      const weekStart = formatDate(state.currentWeekStart);
      panel.innerHTML = `
        <div class="settings-bar">
          <label class="field">Week starts
            <select id="weekStartSelect">
              <option ${state.weekStartDay === "Mon" ? "selected" : ""}>Mon</option>
              <option ${state.weekStartDay === "Sun" ? "selected" : ""}>Sun</option>
            </select>
          </label>
          <label class="field">Anchor cuisine ${cuisineSelect("anchorSelect", state.anchorCuisine)}</label>
          <div class="segmented">${["Weekly","Monthly","Yearly"].map(v => `<button class="${state.weekView === v ? "active" : ""}" data-week-view="${v}">${v}</button>`).join("")}</div>
          <button class="btn" id="cuisineManagerBtn">Cuisines</button>
          <button class="btn" id="refreshBtn">Refresh</button>
        </div>
        <div class="toolbar">
          <button class="btn icon" id="prevWeek">‹</button>
          <div class="week-title">${weekLabel(state.currentWeekStart)}</div>
          <button class="btn icon" id="nextWeek">›</button>
          <button class="btn" id="todayBtn">Today</button>
          <button class="btn good" id="generateBtn">Generate Week</button>
          <button class="btn primary" id="saveWeekBtn">Save Week</button>
          <button class="btn" id="sendEmailBtn">Send Summary</button>
        </div>
        <div id="weekContent"></div>
      `;
      document.getElementById("weekStartSelect").onchange = e => changeWeekStart(e.target.value);
      document.getElementById("anchorSelect").onchange = e => {
        state.anchorCuisine = e.target.value;
        state.weekData.anchorCuisine = e.target.value;
        localStorage.setItem("anchorCuisine", e.target.value);
        render();
      };
      document.querySelectorAll("[data-week-view]").forEach(btn => btn.onclick = () => { state.weekView = btn.dataset.weekView; renderWeek(); });
      document.getElementById("prevWeek").onclick = () => moveWeek(-7);
      document.getElementById("nextWeek").onclick = () => moveWeek(7);
      document.getElementById("todayBtn").onclick = () => goToday();
      document.getElementById("generateBtn").onclick = generateWeek;
      document.getElementById("saveWeekBtn").onclick = saveWeek;
      document.getElementById("sendEmailBtn").onclick = sendSummary;
      document.getElementById("refreshBtn").onclick = refreshAll;
      document.getElementById("cuisineManagerBtn").onclick = openCuisineManager;
      renderWeekContent();
    }

    function renderWeekContent() {
      const host = document.getElementById("weekContent");
      if (state.weekView === "Weekly") {
        host.innerHTML = `<div class="day-list">${displayDays().map(day => dayCard(day, dateForDay(day), state.weekData.plan[day], true)).join("")}</div>`;
      } else if (state.weekView === "Monthly") {
        host.innerHTML = renderMonth(state.currentMonth, false);
      } else {
        const y = state.currentMonth.getFullYear();
        host.innerHTML = Array.from({ length: 12 }, (_, i) => renderMonth(new Date(y, i, 1), false)).join("");
      }
      bindDayButtons(host);
    }

    function dayCard(day, date, meal, editable) {
      meal = meal || {};
      const main = meal.main || null;
      const cuisine = meal.travel ? "Other" : (main && main.cuisine) || meal.cuisine || state.anchorCuisine;
      const c = cuisineMeta(cuisine);
      const isWeekend = day === "Saturday" || day === "Sunday";
      const classes = ["day-card", isToday(date) ? "today" : "", meal.locked ? "locked" : "", meal.travel ? "travel" : "", meal.blank || !main ? "blank" : "", isWeekend ? "weekend" : ""].join(" ");
      const title = meal.travel ? "Travel" : main ? escapeHtml(main.name) : "No dinner planned";
      const sides = (meal.sides || []).map(s => `<span class="chip">${escapeHtml(s.name || s)}</span>`).join("");
      return `
        <article class="${classes}" data-day="${day}">
          <div class="day-side" style="background:${c.color}">
            <span class="emoji">${meal.travel ? "✈️" : c.emoji}</span>
            <span class="name">${day}</span>
            <span class="date">${shortDate(date)}</span>
            ${meal.locked ? "<span>🔒</span>" : ""}
          </div>
          <div class="day-body">
            <div>
              <div class="meal-line">
                <div>
                  <div class="dish-name ${!main && !meal.travel ? "empty-copy" : ""}">${title}</div>
                  <div class="note">${meal.note ? escapeHtml(meal.note) : meal.blank ? "Blank" : isWeekend && !main ? "Weekend blank" : ""}</div>
                </div>
                ${main ? `<span class="chip main" style="background:${c.color}">${c.emoji} ${escapeHtml(cuisine)}</span>` : ""}
              </div>
            </div>
            <div class="chips">${sides || `<span class="chip">No sides</span>`}</div>
            ${editable ? `<div class="day-actions">
              <button class="mini" data-edit-day="${day}">✓ Done</button>
              <button class="mini" data-swap-day="${day}">⇄ swap</button>
              <button class="mini" data-lock-day="${day}">${meal.locked ? "🔓 Unlock" : "🔒 Lock"}</button>
              <button class="mini" data-blank-day="${day}">✕ Blank</button>
              <button class="mini" data-travel-day="${day}">✈️ Travel</button>

    function renderMonth(monthDate, readOnlyHistory) {
      const start = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
      const end = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0);
      const offset = calendarOffset(start);
      const cells = [];
      for (let i = 0; i < offset; i++) cells.push(`<div class="cal-cell out"></div>`);
      for (let d = 1; d <= end.getDate(); d++) {
        const date = new Date(monthDate.getFullYear(), monthDate.getMonth(), d);
        const meal = findMealByDate(formatDate(date), readOnlyHistory);
        const day = DAYS[(date.getDay() + 6) % 7];
        const weekend = date.getDay() === 0 || date.getDay() === 6;
        const main = meal && meal.main;
        const cuisine = (main && main.cuisine) || (meal && meal.cuisine) || "Other";
        const c = cuisineMeta(cuisine);
        const classes = ["cal-cell", isToday(date) ? "today" : "", weekend ? "weekend" : "", meal && meal.travel ? "travel" : "", meal && meal.blank ? "blank" : "", !main && !(meal && meal.travel) ? "empty" : ""].join(" ");
        cells.push(`<div class="${classes}" data-date="${formatDate(date)}">
          <div class="cal-date"><span>${d}</span><span>${day.slice(0,3)}</span></div>
          ${meal && meal.travel ? `<span class="cal-emoji">✈️</span><div class="cal-dish">Travel</div>` : main ? `<span class="cal-emoji">${c.emoji}</span><div class="cal-dish">${escapeHtml(main.name)}</div><div class="cal-sides">${escapeHtml((meal.sides || []).map(s => s.name || s).join(", "))}</div>` : `<div class="cal-dish muted">${meal && meal.blank ? "—" : "+"}</div>`}
        </div>`);
      }
      return `<h2 class="month-title">${monthName(monthDate)}</h2><div class="calendar-grid">${orderedDows().map(d => `<div class="dow">${d.slice(0,3)}</div>`).join("")}${cells.join("")}</div>`;
    }

    function generateWeek() {
      const used = new Set();
      const recentCutoff = addDays(new Date(), -14);
      DAYS.forEach((day, index) => {
        const meal = state.weekData.plan[day] || {};
        const weekend = day === "Saturday" || day === "Sunday";
        if (meal.locked || meal.travel || weekend) {
          if (weekend && !meal.main && !meal.travel) state.weekData.plan[day] = { date: formatDate(dateForDay(day)), main: null, sides: [], note: "", locked: false, blank: true, travel: false };
          return;
        }
        const pool = rankedMains(state.anchorCuisine, recentCutoff).filter(d => !used.has(d.id));
        const fallback = rankedMains("", recentCutoff).filter(d => !used.has(d.id));
        const main = pool[0] || fallback[0];
        if (!main) return;
        used.add(main.id);
        state.weekData.plan[day] = {
          date: formatDate(dateForDay(day)),
          main,
          sides: pickSides(main),
          note: "",
          locked: false,
          blank: false,
          travel: false
        };
      });
      render();
      toast("Week generated");
    }

    function rankedMains(cuisine, recentCutoff) {
      return state.dishes.filter(d => d.type === "main")
        .filter(d => !cuisine || d.cuisine === cuisine)
        .filter(d => !d.lastServed || parseDate(d.lastServed) < recentCutoff)
        .sort((a, b) => (a.lastServed || "0000-00-00").localeCompare(b.lastServed || "0000-00-00") || Number(b.rating || 0) - Number(a.rating || 0));
    }

    function pickSides(main) {
      return state.dishes.filter(d => d.type === "side" && (d.cuisine === main.cuisine || d.cuisine === "Other")).slice(0, 2);
    }

    function swapDay(day) {
      const meal = state.weekData.plan[day];
      if (meal && meal.locked) return toast("Unlock the day before swapping");
      const currentId = meal && meal.main && meal.main.id;
      const pool = rankedMains((meal && meal.main && meal.main.cuisine) || state.anchorCuisine, addDays(new Date(), -14)).filter(d => d.id !== currentId);
      if (!pool.length) return toast("No alternate dish found");
      state.weekData.plan[day].main = pool[0];
      state.weekData.plan[day].blank = false;
      state.weekData.plan[day].travel = false;
      render();
      toast("Dish swapped");
    }

    async function apiGet(action, params) {
      assertApi();
      const url = new URL(API_URL);
      url.searchParams.set("action", action);
      Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
      const res = await fetch(url.toString(), { method: "GET" });
      return unwrap(await res.json());
    }

    async function apiPost(action, payload) {
      assertApi();
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({ action }, payload || {}))
      });
      return unwrap(await res.json());
    }

    function unwrap(json) {
      if (!json || !json.ok) throw new Error((json && json.error) || "API request failed");
      return json.data;
    }

    function assertApi() {
      if (!API_URL || API_URL.includes("PASTE_")) throw new Error("Paste your deployed Apps Script Web App URL into API_URL at the top of index.html");
    }

    function makeEmptyWeek(weekStart) {
      const plan = {};
      DAYS.forEach((day, index) => {
        const weekend = day === "Saturday" || day === "Sunday";
        plan[day] = { date: formatDate(addDays(parseDate(weekStart), index)), main: null, sides: [], note: "", locked: false, blank: weekend, travel: false };
      });
      return { anchorCuisine: state.anchorCuisine, plan };
    }

    function normalizeWeek(data, weekStart) {
      const base = makeEmptyWeek(weekStart);
      data = data || {};
      base.anchorCuisine = data.anchorCuisine || state.anchorCuisine;
      DAYS.forEach(day => base.plan[day] = Object.assign(base.plan[day], data.plan && data.plan[day] || {}));
      return base;
    }

    function normalizeDishes(dishes) {
      return dishes.map(d => ({
        id: String(d.id || makeId()),
        name: d.name || "",
        cuisine: d.cuisine || "Other",
        type: d.type || "main",
        lastServed: d.lastServed || "",
        notes: d.notes || "",
        tags: d.tags || "",
        rating: d.rating || ""
      })).filter(d => d.name);
    }

    function changeWeekStart(value) {
      state.weekStartDay = value;
      localStorage.setItem("weekStartDay", value);
      render();
    }

    function moveWeek(days) {
      state.currentWeekStart = addDays(state.currentWeekStart, days);
      state.currentMonth = new Date(state.currentWeekStart.getFullYear(), state.currentWeekStart.getMonth(), 1);
      loadWeek(formatDate(state.currentWeekStart));
    }

    function moveMonth(delta) {
      state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() + delta, 1);
      render();
    }

    function goToday() {
      state.currentWeekStart = startOfWeek(new Date(), "Mon");
      state.currentMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      loadWeek(formatDate(state.currentWeekStart));
    }

    function displayDays() { return state.weekStartDay === "Sun" ? ["Sunday"].concat(DAYS.slice(0, 6)) : DAYS; }
    function dateForDay(day) { return addDays(state.currentWeekStart, DAYS.indexOf(day)); }
    function findDish(id) { return state.dishes.find(d => d.id === id); }
    function cuisineMeta(name) { return CUISINES[name] || CUISINES.Other; }
    function ensureCuisine(name) {
      if (!name || CUISINES[name]) return;
      CUISINES[name] = { emoji: "🍽️", color: "#7F8C8D" };
      saveCustomCuisines();
    }
    function saveCustomCuisines() {
      const builtIns = ["Korean", "Japanese", "Italian", "American", "Chinese", "Mediterranean", "Southeast Asian", "Other"];
      const custom = {};
      Object.keys(CUISINES).forEach(name => { if (!builtIns.includes(name)) custom[name] = CUISINES[name]; });
      localStorage.setItem("customCuisines", JSON.stringify(custom));
    }
    function cuisineSelect(id, value, includeAll) {
      return `<select id="${id}">${includeAll ? `<option value="">All cuisines</option>` : ""}${Object.keys(CUISINES).map(c => `<option value="${escapeAttr(c)}" ${c === value ? "selected" : ""}>${CUISINES[c].emoji} ${escapeHtml(c)}</option>`).join("")}</select>`;
    }
    function filteredDishes() {
      const f = state.libraryFilters;
      return state.dishes.filter(d =>
        (!f.q || [d.name, d.notes, d.tags].join(" ").toLowerCase().includes(f.q.toLowerCase())) &&
        (!f.cuisine || d.cuisine === f.cuisine) &&
        (!f.type || d.type === f.type) &&
        (!f.tag || splitTags(d.tags).includes(f.tag))
      );
    }
    function uniqueTags() { return [...new Set(state.dishes.flatMap(d => splitTags(d.tags)))].sort(); }
    function splitTags(tags) { return String(tags || "").split(",").map(t => t.trim()).filter(Boolean); }
    function findMealByDate(dateText, history) {
      if (history) {
        for (const h of state.history) {
          if (!dateInWeek(dateText, h.weekStartDate)) continue;
          const data = normalizeWeek(h.weekData || {}, h.weekStartDate);
          const day = DAYS[(parseDate(dateText).getDay() + 6) % 7];
          return data.plan[day];
        }
        return null;
      }
      if (!dateInWeek(dateText, formatDate(state.currentWeekStart))) return null;
      return state.weekData.plan[DAYS[(parseDate(dateText).getDay() + 6) % 7]];
    }
    function dateInWeek(dateText, weekStartText) {
      const d = parseDate(dateText);
      const s = parseDate(weekStartText);
      const e = addDays(s, 6);
      return d >= s && d <= e;
    }
    function orderedDows() { return state.weekStartDay === "Sun" ? ["Sunday"].concat(DAYS.slice(0,6)) : DAYS; }
    function calendarOffset(date) {
      const day = date.getDay();
      return state.weekStartDay === "Sun" ? day : (day + 6) % 7;
    }
    function startOfWeek(date, start) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const offset = start === "Sun" ? d.getDay() : (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - offset);
      return d;
    }
    function parseDate(text) {
      const [y, m, d] = String(text).split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function addDays(date, days) {
      const d = new Date(date);
      d.setDate(d.getDate() + days);
      return d;
    }
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    function shortDate(date) { return date.toLocaleDateString([], { month: "short", day: "numeric" }); }
    function monthName(date) { return date.toLocaleDateString([], { month: "long", year: "numeric" }); }
    function weekLabel(date) { return `${shortDate(date)} - ${shortDate(addDays(date, 6))}`; }
    function isToday(date) { return formatDate(date) === formatDate(new Date()); }
    function stars(n) { return n ? "★★★★★".slice(0, Number(n)) : "No rating"; }
    function makeId() { return "dish_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
    function clone(value) { return JSON.parse(JSON.stringify(value || {})); }
    function setStatus(text) { document.getElementById("syncStatus").textContent = text; }
    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove("show"), 2600);
    }
    function openModal(html) {
      const overlay = document.getElementById("modalOverlay");
      overlay.innerHTML = `<div class="modal">${html}</div>`;
      overlay.classList.add("open");
      overlay.onclick = e => { if (e.target === overlay) closeModal(); };
    }
    function closeModal() {
      const overlay = document.getElementById("modalOverlay");
      overlay.classList.remove("open");
      overlay.innerHTML = "";
    }
    function bindGlobalKeys() {
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, "&#96;"); }
  </script>
</body>
</html>
